name: worker-ci
on:
  push:
    branches:
      - fix/mql5-gateway-client-auth
      - feat/mt5-local-readonly-bridge
  pull_request:
    branches:
      - main
      - fix/mql5-gateway-client-auth
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/trading-research-agent.test.mjs
